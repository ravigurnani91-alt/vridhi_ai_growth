name: Refresh Vridhi live source signals

on:
  schedule:
    # Every other calendar day at 10:00 IST (04:30 UTC). GitHub may delay scheduled runs.
    - cron: "30 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vridhi-live-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: foundation/vridhi-umbrella
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh source feed
        run: python3 .github/scripts/update_live_signals.py
      - name: Commit updated feed when changed
        run: |
          if git diff --quiet -- journal/briefs/live-signals.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/briefs/live-signals.json
          git commit -m "Refresh Vridhi live source signals"
          git push origin HEAD:foundation/vridhi-umbrella
