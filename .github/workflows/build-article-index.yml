name: Build Vridhi article index

on:
  push:
    branches:
      - foundation/vridhi-umbrella
    paths:
      - "journal/**/index.html"
      - "originals/**/index.html"
      - "articles.json"
      - ".github/scripts/build_article_index.py"
      - ".github/workflows/build-article-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vridhi-article-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: foundation/vridhi-umbrella
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build central article index
        run: python3 .github/scripts/build_article_index.py
      - name: Commit index when changed
        run: |
          if git diff --quiet -- articles.json; then
            echo "Article index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "Automatically update Vridhi article index"
          git push origin HEAD:foundation/vridhi-umbrella
