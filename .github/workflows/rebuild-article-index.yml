name: Rebuild Vridhi article index

on:
  push:
    branches:
      - foundation/vridhi-umbrella
    paths:
      - 'journal/**/index.html'
      - 'originals/**/index.html'
      - 'discover/**/index.html'
      - 'earth/**/index.html'
      - 'scripts/build_article_index.py'
      - 'script.js'
      - '.github/workflows/rebuild-article-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vridhi-article-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: foundation/vridhi-umbrella
      - name: Rebuild article index from Article structured data
        run: python3 scripts/build_article_index.py
      - name: Commit updated index when changed
        run: |
          if ! git diff --quiet -- articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "Automatically refresh Vridhi article index"
            git push
          else
            echo "Article index is already current."
          fi
