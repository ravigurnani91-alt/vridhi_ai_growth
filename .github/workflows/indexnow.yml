name: Notify search engines

on:
  push:
    branches:
      - foundation/vridhi-umbrella
    paths:
      - "*.html"
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/indexnow-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          host = "vridhi.ink"
          key = "c474bab0531d27587de014737516733b"
          key_location = f"https://{host}/vridhi-indexnow-key.txt"
          sitemap_url = f"https://{host}/sitemap.xml"

          with urllib.request.urlopen(sitemap_url, timeout=30) as response:
              sitemap = ET.fromstring(response.read())

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = sorted({
              node.text.strip()
              for node in sitemap.findall(".//sm:loc", ns)
              if node.text and node.text.strip().startswith(f"https://{host}/")
          })

          if not urls:
              raise SystemExit("No canonical Vridhi URLs found in sitemap; refusing empty submission.")

          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": urls
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow accepted submission: HTTP {response.status}")
                  print(f"Submitted {len(urls)} URLs from {sitemap_url}")
          except urllib.error.HTTPError as error:
              print(f"IndexNow returned HTTP {error.code}: {error.read().decode('utf-8', 'replace')}")
              raise
          PY
